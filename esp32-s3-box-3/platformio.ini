[env:esp32s3box]
platform = espressif32
board = esp32s3box
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv

; Pass arguments to CMake
; You can set these environment variables in your shell, or uncomment and hardcode them here.
board_build.cmake_extra_args = 
    -DWIFI_SSID="${sysenv.WIFI_SSID}"
    -DWIFI_PASSWORD="${sysenv.WIFI_PASSWORD}"
    -DPIPECAT_SMALLWEBRTC_URL="${sysenv.PIPECAT_SMALLWEBRTC_URL}"

; Example of hardcoding credentials (uncomment and replace):
; board_build.cmake_extra_args = 
;     -DWIFI_SSID=\"MyWiFiNetwork\"
;     -DWIFI_PASSWORD=\"MySecretPassword\"
;     -DPIPECAT_SMALLWEBRTC_URL=\"http://192.168.1.100:7860/api/offer\"
;
; For Open WiFi (No Password), use empty escaped quotes:
;     -DWIFI_PASSWORD=\"\"

